services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stockpipe
      POSTGRES_PASSWORD: stockpipe
      POSTGRES_DB: stockpipe
    ports:
      - "5432:5432"
    volumes:
      - /home/lkw/data/pg_data:/var/lib/postgresql/data
      - ./script/init_db.sql:/docker-entrypoint-initdb.d/init.sql

  mongo:
    image: mongo:8.0.32
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - /home/lkw/data/mongo:/data/db

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - /home/lkw/data/grafana:/var/lib/grafana

  airflow:
    build: .
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: stockpipe-secret
      STOCKPIPE_DB_HOST: postgres
      S2R_MONGO_URI: ${S2R_MONGO_URI:-}
      S2R_PG1_HOST: ${S2R_PG1_HOST:-postgres}
      S2R_PG1_PORT: ${S2R_PG1_PORT:-5432}
      S2R_PG1_DATABASE: ${S2R_PG1_DATABASE:-s2r}
      S2R_PG1_USER: ${S2R_PG1_USER:-stockpipe}
      S2R_PG1_PASSWORD: ${S2R_PG1_PASSWORD:-}
      S2R_PG1_READ_USER: ${S2R_PG1_READ_USER:-stockpipe}
      S2R_PG1_READ_PASSWORD: ${S2R_PG1_READ_PASSWORD:-}
      S2R_PG2_HOST: ${S2R_PG2_HOST:-postgres}
      S2R_PG2_PORT: ${S2R_PG2_PORT:-5432}
      S2R_PG2_DATABASE: ${S2R_PG2_DATABASE:-stockpipe}
      S2R_PG2_USER: ${S2R_PG2_USER:-stockpipe}
      S2R_PG2_PASSWORD: ${S2R_PG2_PASSWORD:-}
      S2R_PG2_ADMIN_USER: ${S2R_PG2_ADMIN_USER:-stockpipe}
      S2R_PG2_ADMIN_PASSWORD: ${S2R_PG2_ADMIN_PASSWORD:-}
      S2R_FDW_PG1_HOST: ${S2R_FDW_PG1_HOST:-postgres}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - /home/lkw/data/airflow:/opt/airflow/logs
      - ./dbt:/opt/airflow/dbt
      - ./pipeline.yml:/opt/airflow/pipeline.yml:ro
    depends_on:
      - postgres
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true &&
        airflow standalone
      "
