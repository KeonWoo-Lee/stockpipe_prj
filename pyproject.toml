[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockpipe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pykrx", "psycopg[binary]", "sqlalchemy", "click", "pydantic", "pydantic-settings", "httpx",]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-mock", "ruff", "mypy"]

[project.scripts]
stockpipe = "stockpipe.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]